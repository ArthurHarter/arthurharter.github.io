<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Ligação de chuveiro em 220 V entre fases</title>
<desc id="d">Do quadro sai um circuito exclusivo protegido por DR de 30 mA e disjuntor bipolar. Duas fases vão ao chuveiro e o condutor de proteção verde-amarelo vai à carcaça. Em 220 V entre fases não há neutro neste circuito.</desc>
<rect width="800" height="360" rx="14" fill="#141414"/>
<text x="32" y="44" fill="#F0EDE6" font-size="20" font-weight="700">Chuveiro em 220 V (fase + fase): circuito exclusivo</text>
<text x="32" y="68" fill="#888" font-size="13">Exemplo 5500 W: 25 A, fio de 4 mm², disjuntor bipolar de 25 ou 32 A, DR de 30 mA (NBR 5410, 5.1.3.2.2 e 9.5.3.1)</text>
<rect x="32" y="95" width="250" height="230" rx="10" fill="#1A1A1A" stroke="#3A3A3A"/>
<text x="157" y="120" fill="#888" font-size="12" text-anchor="middle">QUADRO</text>
<rect x="72" y="140" width="170" height="54" rx="8" fill="#1E1E1E" stroke="#4EA8DE"/><text x="157" y="164" fill="#F0EDE6" font-size="14" font-weight="700" text-anchor="middle">DR 30 mA</text><text x="157" y="182" fill="#888" font-size="11" text-anchor="middle">bipolar</text>
<path d="M157 194 V214" stroke="#F5C518" stroke-width="3"/><rect x="72" y="214" width="170" height="54" rx="8" fill="#1E1E1E" stroke="#F5C518"/><text x="157" y="238" fill="#F0EDE6" font-size="14" font-weight="700" text-anchor="middle">Disjuntor 32 A</text><text x="157" y="256" fill="#888" font-size="11" text-anchor="middle">bipolar, curva C</text>
<rect x="62" y="290" width="190" height="16" rx="4" fill="#3CB371" fill-opacity=".2" stroke="#3CB371"/><text x="157" y="302" fill="#3CB371" font-size="11" text-anchor="middle" font-weight="700">barramento de terra</text>
<path d="M242 232 H560" stroke="#E5484D" stroke-width="4"/>
<path d="M242 250 H560" stroke="#F0EDE6" stroke-width="4"/>
<path d="M252 298 H420 V268 H560" stroke="#3CB371" stroke-width="4" fill="none"/>
<path d="M252 298 H420 V268 H560" stroke="#F5C518" stroke-width="4" stroke-dasharray="6 10" fill="none"/>
<g font-size="12" fill="#B8B4AC"><text x="300" y="224">fase 1 · 4 mm²</text><text x="300" y="266" dy="-2">fase 2 · 4 mm²</text><text x="430" y="292">terra (PE) · 4 mm²</text></g>
<rect x="560" y="200" width="200" height="100" rx="12" fill="#1E1E1E" stroke="#3A3A3A"/>
<text x="660" y="236" fill="#F0EDE6" font-size="15" font-weight="700" text-anchor="middle">Chuveiro</text>
<text x="660" y="256" fill="#888" font-size="12" text-anchor="middle">5500 W · 220 V · 25 A</text>
<text x="660" y="280" fill="#888" font-size="11" text-anchor="middle">conector adequado, sem fita</text>
<text x="32" y="345" fill="#888" font-size="12">Em rede 220/380 V, o 220 V é fase + neutro (azul-claro) e o disjuntor pode ser unipolar na fase. · guiaeletricafacil.com.br</text>
</svg>
