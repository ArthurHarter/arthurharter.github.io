<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Quadro de distribuição residencial: ordem dos dispositivos</title>
<desc id="d">A energia vem do medidor, passa pelo disjuntor geral, tem DPS ligado ao barramento de terra, segue para DRs de 30 mA e depois para os disjuntores de cada circuito. Neutro e terra ficam em barramentos separados.</desc>
<rect width="800" height="470" rx="14" fill="#141414"/>
<text x="32" y="44" fill="#F0EDE6" font-size="20" font-weight="700">Quadro de distribuição: o caminho da energia</text>
<text x="32" y="68" fill="#888" font-size="13">Esquema simplificado. DR: item 5.1.3.2.2 · DPS: item 5.4.2.1.1 · Reserva de espaço: Tabela 59 (NBR 5410:2004)</text>
<g font-size="13" text-anchor="middle" fill="#F0EDE6">
<rect x="32" y="110" width="110" height="64" rx="8" fill="#1E1E1E" stroke="#3A3A3A"/><text x="87" y="138" font-weight="700">Medidor</text><text x="87" y="157" fill="#888" font-size="11">concessionária</text>
<rect x="182" y="110" width="110" height="64" rx="8" fill="#1E1E1E" stroke="#F5C518"/><text x="237" y="138" font-weight="700">Disjuntor</text><text x="237" y="155" font-weight="700">geral</text>
<rect x="332" y="110" width="110" height="64" rx="8" fill="#1E1E1E" stroke="#3A3A3A"/><text x="387" y="138" font-weight="700">DPS</text><text x="387" y="157" fill="#888" font-size="11">surtos → terra</text>
<path d="M142 142 H182 M292 142 H332" stroke="#F5C518" stroke-width="3"/>
<path d="M292 142 H312 V230 H460" stroke="#F5C518" stroke-width="3" fill="none"/>
<path d="M387 174 V400" stroke="#3CB371" stroke-width="2.5" stroke-dasharray="7 5"/>
<rect x="460" y="200" width="250" height="60" rx="8" fill="#1E1E1E" stroke="#4EA8DE"/><text x="585" y="226" font-weight="700">DR 30 mA</text><text x="585" y="245" fill="#888" font-size="11">banheiro, cozinha, serviço, externas</text>
<path d="M585 260 V300" stroke="#F5C518" stroke-width="3"/>
<path d="M470 300 H690" stroke="#F5C518" stroke-width="3"/>
<g>
<path d="M470 300 V322 M543 300 V322 M616 300 V322 M690 300 V322" stroke="#F5C518" stroke-width="3"/>
<rect x="440" y="322" width="60" height="44" rx="6" fill="#1E1E1E" stroke="#3A3A3A"/><text x="470" y="349" font-size="12">20 A</text>
<rect x="513" y="322" width="60" height="44" rx="6" fill="#1E1E1E" stroke="#3A3A3A"/><text x="543" y="349" font-size="12">20 A</text>
<rect x="586" y="322" width="60" height="44" rx="6" fill="#1E1E1E" stroke="#3A3A3A"/><text x="616" y="349" font-size="12">20 A</text>
<rect x="660" y="322" width="60" height="44" rx="6" fill="#1E1E1E" stroke="#3A3A3A"/><text x="690" y="349" font-size="12">32 A</text>
<g fill="#888" font-size="11"><text x="470" y="384">Banheiro</text><text x="543" y="384">Cozinha</text><text x="616" y="384">Área serv.</text><text x="690" y="384">Chuveiro</text></g>
</g>
<path d="M312 230 V300 H232" stroke="#F5C518" stroke-width="3" fill="none"/>
<rect x="150" y="300" width="80" height="44" rx="6" fill="#1E1E1E" stroke="#3A3A3A"/><text x="190" y="327" font-size="12">10 A</text>
<text x="190" y="362" fill="#888" font-size="11">Iluminação</text><text x="190" y="377" fill="#888" font-size="11">(DR recomendado)</text>
</g>
<g font-size="12">
<rect x="32" y="400" width="300" height="18" rx="4" fill="#4EA8DE" fill-opacity=".25" stroke="#4EA8DE"/><text x="182" y="413" fill="#4EA8DE" text-anchor="middle" font-weight="700">Barramento de neutro (azul-claro)</text>
<rect x="352" y="400" width="300" height="18" rx="4" fill="#3CB371" fill-opacity=".2" stroke="#3CB371"/><text x="502" y="413" fill="#3CB371" text-anchor="middle" font-weight="700">Barramento de terra (verde-amarelo)</text>
<text x="32" y="446" fill="#B8B4AC" font-size="13">Neutro e terra em barramentos separados. Deixe posições livres de reserva para circuitos futuros.</text>
</g>
</svg>
