<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Regra Ib ≤ In ≤ Iz da NBR 5410</title>
<desc id="d">Chuveiro de 5500 W em 220 V: corrente de 25 A, disjuntor de 25 ou 32 A, fio de 4 mm² que conduz 32 A. Disjuntor de 40 A deixaria o fio desprotegido.</desc>
<rect width="800" height="330" rx="14" fill="#141414"/>
<text x="32" y="44" fill="#F0EDE6" font-size="20" font-weight="700">Ib ≤ In ≤ Iz — chuveiro de 5500 W em 220 V, fio de 4 mm²</text>
<text x="32" y="68" fill="#888" font-size="13">NBR 5410:2004 (Versão Corrigida 2008), item 5.3.4 · Tabela 36, método B1, 2 condutores carregados</text>
<g transform="translate(60,0)">
<line x1="0" y1="200" x2="680" y2="200" stroke="#3A3A3A" stroke-width="2"/>
<g fill="#888" font-size="12" text-anchor="middle">
<line x1="0" y1="194" x2="0" y2="206" stroke="#3A3A3A"/><text x="0" y="224">0 A</text>
<line x1="170" y1="194" x2="170" y2="206" stroke="#3A3A3A"/><text x="170" y="224">10 A</text>
<line x1="340" y1="194" x2="340" y2="206" stroke="#3A3A3A"/><text x="340" y="224">20 A</text>
<text x="510" y="224"></text>
<line x1="680" y1="194" x2="680" y2="206" stroke="#3A3A3A"/><text x="680" y="224">40 A</text>
</g>
<rect x="425" y="150" width="119" height="36" rx="6" fill="#F5C518" fill-opacity=".16" stroke="#F5C518"/>
<text x="484" y="250" fill="#F5C518" font-size="12" font-weight="700" text-anchor="middle">faixa permitida para In</text>
<g font-size="14" font-weight="700" text-anchor="middle">
<line x1="425" y1="110" x2="425" y2="200" stroke="#F0EDE6" stroke-width="3"/><circle cx="425" cy="200" r="6" fill="#F0EDE6"/>
<text x="425" y="98" fill="#F0EDE6">Ib = 25 A</text><text x="425" y="116" fill="#888" font-size="11" font-weight="400" dy="-34">corrente do chuveiro</text>
<line x1="544" y1="110" x2="544" y2="200" stroke="#3CB371" stroke-width="3"/><circle cx="544" cy="200" r="6" fill="#3CB371"/>
<text x="544" y="98" fill="#3CB371">Iz = 32 A</text><text x="544" y="116" fill="#888" font-size="11" font-weight="400" dy="-34">o que o fio aguenta</text>
<line x1="680" y1="150" x2="680" y2="200" stroke="#E5484D" stroke-width="3" stroke-dasharray="5 4"/><circle cx="680" cy="200" r="6" fill="#E5484D"/>
<text x="664" y="140" fill="#E5484D" text-anchor="end">40 A: proibido</text>
</g>
</g>
<g font-size="13" fill="#B8B4AC">
<text x="32" y="262"><tspan fill="#F0EDE6" font-weight="700">Ib</tspan> corrente de projeto · <tspan fill="#F0EDE6" font-weight="700">In</tspan> corrente nominal do disjuntor · <tspan fill="#F0EDE6" font-weight="700">Iz</tspan> capacidade do fio nas condições reais</text>
<text x="32" y="286">Disjuntores comerciais dentro da faixa: 25 A e 32 A. Com 40 A o fio de 4 mm² aquece além do limite sem que o disjuntor desarme.</text>
<text x="32" y="310" fill="#888" font-size="12">guiaeletricafacil.com.br</text>
</g>
</svg>
